server {
    listen 443 ssl default_server; # Set as default server for HTTPS
    listen [::]:443 ssl default_server; # Include IPv6
    server_name timechaindemo.io _; # Catch-all for any hostname

    root /var/www/timechaindemo/dist;
    index index.html;

    location / {
        try_files $uri /index.html; # Serve files or fallback to index.html
    }

    # SSL configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/timechaindemo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timechaindemo.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP server block (port 80)
server {
    listen 80 default_server; # Set as default server for HTTP
    listen [::]:80 default_server; # Include IPv6
    server_name timechaindemo.io _; # Catch-all for any hostname

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}
